   All Europe: framed tight on the guide cluster. East cut to 30°E (drops
   the empty Russia/Turkey expanse), north cut to 67°N and south to 35.5°N
   so the continent fills the frame instead of shrinking to fit the Arctic.
   West keeps -24 so Iceland stays in. Tromsø (69.6°N) is above this crop —
   it lives on the "N. Europe" zoom.                                        */
const SUBREGIONS = {
  all:   [[-24, 35.5], [30, 67]],   // tight on the cluster — fills the frame
  west:  [[-12, 36], [20, 63]],   // UK · Ireland · France · Iberia · Benelux · DACH · Italy N
  north: [[ -5, 54], [32, 72]],   // Scandinavia · Finland · Baltics
  east:  [[ 11, 35], [42, 57]],   // Central · Eastern · Balkans · Greece · Ukraine
};
let activeBounds = SUBREGIONS.all;

let worldData = null;

function showTip(event, name, sub) {
  tn.textContent = name; ts.textContent = sub || ''; tip.style.opacity = '1';
  const r = wrap.getBoundingClientRect();
  let x = event.clientX - r.left + 14, y = event.clientY - r.top - 44;
  const tw = tip.offsetWidth || 140;
  if (x + tw > r.width - 8) x = event.clientX - r.left - tw - 14;
  if (y < 4) y = event.clientY - r.top + 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

  g.attr('transform',t);
  var inv=1/t.k;
  g.selectAll('.pin-group').attr('transform',function(){return 'translate('+this.getAttribute('data-bx')+','+this.getAttribute('data-by')+') scale('+inv+')';});
  g.selectAll('.country-label,.state-label,.cap-label').attr('transform',function(){return 'translate('+this.getAttribute('data-bx')+','+this.getAttribute('data-by')+') scale('+inv+')';});
}
function _tagBase(node){var t=node.getAttribute('transform')||'';var m=/translate\(\s*([-0-9.]+)[ ,]+([-0-9.]+)\s*\)/.exec(t);if(m){node.setAttribute('data-bx',m[1]);node.setAttribute('data-by',m[2]);}}
function _afterRender(){
  var svgSel=d3.select('#svg'), g=svgSel.select('.zroot');
  if(g.empty())return;
  g.selectAll('.pin-group').each(function(){_tagBase(this);});
  g.selectAll('.country-label,.state-label,.cap-label').each(function(){_tagBase(this);});
  var W=(typeof wrap!=='undefined'?wrap.clientWidth:svgSel.node().clientWidth);
  var H=(typeof wrap!=='undefined'?wrap.clientHeight:svgSel.node().clientHeight);
  if(!_zoomBeh){_zoomBeh=d3.zoom().scaleExtent([1,12]).on('zoom',_zoomed);svgSel.call(_zoomBeh);}
  _zoomBeh.extent([[0,0],[W,H]]).translateExtent([[0,0],[W,H]]);
  svgSel.call(_zoomBeh.transform, d3.zoomIdentity);
}
function buildMap(){ _renderMap(); _afterRender(); }
function _renderMap(){
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const svgEl = document.getElementById('svg');
  svgEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  if (!worldData) return;

  const countries = topojson.feature(worldData, worldData.objects.countries);
  const borders   = topojson.mesh(worldData, worldData.objects.countries, (a, b) => a !== b);
  const eu = countries.features.filter(f => EU[+f.id]);

  const proj = d3.geoMercator()
    .fitExtent([[10, 8], [W - 10, H - 8]], {
      type: 'Feature',
      geometry: { type: 'LineString', coordinates: [activeBounds[0], activeBounds[1]] }
    });

  const pathGen = d3.geoPath().projection(proj);
  const svgSel=d3.select('#svg'); svgSel.selectAll('*').remove();
  const svg=svgSel.append('g').attr('class','zroot');

  svg.selectAll('.country').data(eu).join('path')
    .attr('class', 'country').attr('d', pathGen)
    .style('fill',d=>COLORS[+d.id]||'#c2a878').style('stroke',d=>darken(COLORS[+d.id]||'#c2a878',0.6)).style('stroke-width',0.8)
    .on('mousemove', (e, d) => { showTip(e, EU[+d.id], ''); })
    .on('mouseleave', () => { tip.style.opacity = '0'; });

  svg.append('path').datum(borders).attr('class', 'borders').attr('d', pathGen);

  // ── Collision-aware label placement ──────────────────────────────
  // Greedy: reserve every pin dot, then place pin labels (priority) at the
  // first free slot around their dot, then country names last — dropped
  // where they'd collide. Keeps all guide labels readable when dense.
  const placed = [];
  const overlaps = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  const fits = r => !placed.some(p => overlaps(p, r));
  function reserve(cx, cy, w, h) { const r = { x1: cx - w/2, y1: cy - h/2, x2: cx + w/2, y2: cy + h/2 }; placed.push(r); return r; }
  function bestSlot(cx, cy, w, h, cands) {
    for (const [dx, dy] of cands) {
      const r = { x1: cx + dx - w/2, y1: cy + dy - h/2, x2: cx + dx + w/2, y2: cy + dy + h/2 };
      if (fits(r)) { placed.push(r); return [dx, dy]; }
    }
    return null;
  }

  // 1) Resolve every visible pin's pixel position and reserve its dot footprint.
  const vis = [];
  PINS.forEach(function(p) {
    const pt = proj([p[1], p[2]]);
    if (!pt || isNaN(pt[0])) return;
    const px = pt[0], py = pt[1];
    if (px < 0 || px > W || py < 0 || py > H) return;
    vis.push({ name: p[0], href: p[3], lon: p[1], lat: p[2], px, py });
  });
  vis.forEach(v => reserve(v.px, v.py, 13, 13));

  // 2) Pin labels — priority. Country-aware: a slot only qualifies outright
  //    if the label text stays over the pin's own country (so Marktoberdorf
  //    never reads as Austrian). Pass 1 tries the nearby slots in-country,
  //    pass 2 ring-searches outward (leader line ties label back to dot),
  //    pass 3 falls back to the first free nearby slot in any country.
  const homeOf = v => eu.find(f => d3.geoContains(f, [v.lon, v.lat])) || null;
  const RING = [];
  [28,36,44,52,60,70,80,92,104,118,132].forEach(function(rr) {
    for (let a = 0; a < 16; a++) RING.push([rr*Math.cos(a*Math.PI/8), rr*Math.sin(a*Math.PI/8)]);
  });
  const pinG = svg.append('g');
  const FS = 11.5;
  vis.forEach(function(v) {
    const g = pinG.append('g').attr('class', 'pin-group')
      .attr('transform', 'translate(' + v.px + ',' + v.py + ')')
      .on('click', () => window.open(v.href, '_blank'))
      .on('mousemove', e => { showTip(e, v.name, '📖 Open Guide'); })
      .on('mouseleave', () => { tip.style.opacity = '0'; });
    const w = v.name.length * FS * 0.62 + 4, h = FS + 4;
    const up = -(h/2 + 8), dn = (h/2 + 8), rt = (w/2 + 11), lf = -(w/2 + 11);
    const cands = [[0,up],[0,dn],[rt,0],[lf,0],[rt,up],[lf,up],[rt,dn],[lf,dn],[0,up-h],[0,dn+h],[0,up-2*h],[0,dn+2*h]];
    const home = homeOf(v);
    const inHome = function(dx, dy) {
      if (!home) return true;
      const ll = proj.invert([v.px + dx, v.py + dy]);
      return !!ll && d3.geoContains(home, ll);
    };
    let slot = null;
    for (const [dx, dy] of cands) {
      const r = { x1: v.px + dx - w/2, y1: v.py + dy - h/2, x2: v.px + dx + w/2, y2: v.py + dy + h/2 };
      if (fits(r) && inHome(dx, dy)) { placed.push(r); slot = [dx, dy]; break; }
    }
    if (!slot && home) {
      for (const [dx, dy] of RING) {
        const r = { x1: v.px + dx - w/2, y1: v.py + dy - h/2, x2: v.px + dx + w/2, y2: v.py + dy + h/2 };
        if (fits(r) && inHome(dx, dy)) { placed.push(r); slot = [dx, dy]; break; }
      }
    }
    if (!slot) slot = bestSlot(v.px, v.py, w, h, cands) || [0, up];
    // Leader line ties an offset label back to its dot so the dot stays anchored.
    const dist = Math.sqrt(slot[0]*slot[0] + slot[1]*slot[1]);
    if (dist > 15) {
      const ux = slot[0]/dist, uy = slot[1]/dist;
      g.append('line').attr('class', 'pin-leader')
        .attr('x1', ux*5.5).attr('y1', uy*5.5)
        .attr('x2', slot[0] - ux*6).attr('y2', slot[1] - uy*6);
    }
    g.append('circle').attr('class', 'pin-circle').attr('r', 5.5);
    g.append('text').attr('class', 'pin-label').attr('x', slot[0]).attr('y', slot[1]).text(v.name);
  });

  // 3) Country labels — placed last, dropped where they collide. Large first.
  const labelData = eu.filter(f => LARGE.has(+f.id) || MEDIUM.has(+f.id))
    .sort((a, b) => (LARGE.has(+b.id) ? 1 : 0) - (LARGE.has(+a.id) ? 1 : 0));
  const cLayer = svg.append('g');
  labelData.forEach(function(d) {
    const c = (+d.id === 643) ? proj([36, 59]) : pathGen.centroid(d);
    if (!c || isNaN(c[0])) return;
    const txt = SHORT[EU[+d.id]] || EU[+d.id];
    const w = txt.length * 12 * 0.6 + 2, h = 14;
    const slot = bestSlot(c[0], c[1], w, h, [[0,0],[0,-13],[0,13],[16,0],[-16,0]]);
    if (!slot) return; // would collide with a pin or another label — skip
    cLayer.append('text')
      .attr('class', LARGE.has(+d.id) ? 'country-label large' : 'country-label medium')
      .attr('transform', 'translate(' + (c[0] + slot[0]) + ',' + (c[1] + slot[1]) + ')')
      .text(txt);
  });
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(world => { worldData = world; buildMap(); })
  .catch(() => {
    d3.select('#svg').append('text').attr('x', '50%').attr('y', '50%')
      .attr('text-anchor', 'middle').attr('fill', '#6b4422').attr('font-size', 16)
      .text('Could not load map data — please check your internet connection.');
  });

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildMap, 80); });

/* ── Zoom button click handlers ── */
document.querySelectorAll('.zn').forEach(function(el) {
  el.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.zn').forEach(function(z) { z.classList.remove('zn-on'); });
    el.classList.add('zn-on');
    activeBounds = SUBREGIONS[el.dataset.key];
    buildMap();
  });
});
</script>
</body>
</html>
