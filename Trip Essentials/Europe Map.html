<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europe Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #f5f4f0; /* --c-page-bg */
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 16px;
  }
  h1 { font-size: 20px; font-weight: 700; color: #6b4422; margin-bottom: 16px; letter-spacing: -0.01em; }
  #wrap {
    position: relative; width: 100%; max-width: 960px; height: 620px;
    background: #e8dfd0; /* warm toned ocean */
    border-radius: 16px; overflow: hidden;
    box-shadow: 0 2px 24px rgba(0,0,0,0.10);
  }
  svg { width: 100%; height: 100%; }
  .country { stroke: #fdf8f0; stroke-width: 1.4; cursor: default; transition: filter 0.12s; }
  .country:hover { filter: brightness(1.12); }
  .borders { fill: none; stroke: rgba(253,248,240,0.7); stroke-width: 0.7; pointer-events: none; }
  .country-label {
    font-size: 9px; font-weight: 700; fill: #3a1a00;
    text-anchor: middle; dominant-baseline: central;
    pointer-events: none; user-select: none;
    paint-order: stroke; stroke: rgba(253,248,240,0.8); stroke-width: 3px;
  }
  .country-label.large { font-size: 11px; }
  .country-label.medium { font-size: 9.5px; }

  /* Pins — using guide brand colors */
  .pin-group { cursor: pointer; }
  .pin-circle {
    fill: #6b4422;            /* --c-title-bg */
    stroke: #fdf8f0;          /* --c-warm-bg */
    stroke-width: 2;
    transition: transform 0.15s, fill 0.15s;
    transform-origin: center; transform-box: fill-box;
  }
  .pin-group:hover .pin-circle { fill: #BA7517; transform: scale(1.5); } /* --c-michelin-border */
  .pin-label {
    font-size: 9px; font-weight: 700; fill: #6b4422;
    text-anchor: middle; dominant-baseline: auto;
    pointer-events: none; user-select: none;
    paint-order: stroke; stroke: rgba(253,248,240,0.95); stroke-width: 3.5px;
  }
  .pin-group:hover .pin-label { fill: #BA7517; }

  #tip {
    position: absolute; pointer-events: none;
    background: #6b4422; color: #fdf8f0;
    padding: 7px 15px; border-radius: 8px;
    font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
    box-shadow: 0 4px 18px rgba(0,0,0,0.28);
    white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 99;
  }
  .tip-sub { font-size: 11px; color: #e5c99a; margin-top: 2px; }
  #footer { position: absolute; bottom: 14px; left: 18px; font-size: 13px; color: #6b4422; font-weight: 500; opacity: 0.7; }
  #legend {
    position: absolute; top: 14px; right: 14px;
    background: rgba(253,248,240,0.90); border-radius: 8px;
    padding: 7px 12px; font-size: 11px; color: #6b4422;
    display: flex; align-items: center; gap: 7px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08); font-weight: 600;
  }
  .ldot { width: 10px; height: 10px; border-radius: 50%; background: #6b4422; border: 2px solid #fdf8f0; box-shadow: 0 0 0 1px #6b4422; flex-shrink: 0; }
</style>
</head>
<body>
<div id="toolbar-mount" data-depth="1" data-maxwidth="960"></div>
<script src="../toolbar.js?v=2"></script>
<h1>Europe Map</h1>
<div id="wrap">
  <svg id="svg" viewBox="0 0 900 590"></svg>
  <div id="tip"><div id="tn"></div><div class="tip-sub" id="ts"></div></div>
  <div id="footer">Hover a country · Click a pin to open guide</div>
  <div id="legend"><div class="ldot"></div> Guide available</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const EU = {
  8:'Albania',20:'Andorra',40:'Austria',112:'Belarus',56:'Belgium',
  70:'Bosnia and Herzegovina',100:'Bulgaria',191:'Croatia',196:'Cyprus',
  203:'Czechia',208:'Denmark',233:'Estonia',246:'Finland',250:'France',
  276:'Germany',300:'Greece',348:'Hungary',352:'Iceland',372:'Ireland',
  380:'Italy',428:'Latvia',438:'Liechtenstein',440:'Lithuania',442:'Luxembourg',
  470:'Malta',498:'Moldova',492:'Monaco',499:'Montenegro',528:'Netherlands',
  807:'North Macedonia',578:'Norway',616:'Poland',620:'Portugal',642:'Romania',
  643:'Russia',674:'San Marino',688:'Serbia',703:'Slovakia',705:'Slovenia',
  724:'Spain',752:'Sweden',756:'Switzerland',792:'Turkey',804:'Ukraine',
  826:'United Kingdom',336:'Vatican City',383:'Kosovo'
};
const SHORT = {
  'Albania':'Albania','Andorra':'AND','Austria':'Austria','Belarus':'Belarus',
  'Belgium':'Belgium','Bosnia and Herzegovina':'Bosnia','Bulgaria':'Bulgaria',
  'Croatia':'Croatia','Cyprus':'Cyprus','Czechia':'Czechia','Denmark':'Denmark',
  'Estonia':'Estonia','Finland':'Finland','France':'France','Germany':'Germany',
  'Greece':'Greece','Hungary':'Hungary','Iceland':'Iceland','Ireland':'Ireland',
  'Italy':'Italy','Latvia':'Latvia','Liechtenstein':'LIE','Lithuania':'Lithuania',
  'Luxembourg':'LUX','Malta':'MT','Moldova':'Moldova','Monaco':'MC',
  'Montenegro':'MNE','Netherlands':'Neth.','North Macedonia':'N.Mac.',
  'Norway':'Norway','Poland':'Poland','Portugal':'Portugal','Romania':'Romania',
  'Russia':'Russia','San Marino':'SM','Serbia':'Serbia','Slovakia':'Slovakia',
  'Slovenia':'SVN','Spain':'Spain','Sweden':'Sweden','Switzerland':'Swiss.',
  'Turkey':'Turkey','Ukraine':'Ukraine','United Kingdom':'UK',
  'Vatican City':'VA','Kosovo':'XK'
};

// Country colors — warm, muted palette matching guide aesthetic
const COLORS = {
  8:'#c8956c',   // Albania
  20:'#a05c3b',  // Andorra
  40:'#7aab8a',  // Austria
  112:'#9dbfbf', // Belarus
  56:'#d4a64a',  // Belgium
  70:'#c05a5a',  // Bosnia
  100:'#9ab5c8', // Bulgaria
  191:'#8aaa5a', // Croatia
  196:'#c8956c', // Cyprus
  203:'#6ab4c8', // Czechia
  208:'#c87a5a', // Denmark
  233:'#d4bc6a', // Estonia
  246:'#5abfa0', // Finland
  250:'#6a8fd4', // France
  276:'#c46a8a', // Germany
  300:'#9050b0', // Greece
  348:'#d47a30', // Hungary
  352:'#6ab4cc', // Iceland
  372:'#4ab065', // Ireland
  380:'#5a8ad4', // Italy
  428:'#d03a7a', // Latvia
  438:'#a8ccd8', // Liechtenstein
  440:'#c8956c', // Lithuania
  442:'#c05a5a', // Luxembourg
  470:'#d4a64a', // Malta
  498:'#7aab8a', // Moldova
  492:'#9050b0', // Monaco
  499:'#8aaa5a', // Montenegro
  528:'#d46a6a', // Netherlands
  807:'#6ab4c8', // North Macedonia
  578:'#9dbfbf', // Norway
  616:'#d4bc6a', // Poland
  620:'#c05a5a', // Portugal
  642:'#6a8fd4', // Romania
  643:'#c46a8a', // Russia
  674:'#5abfa0', // San Marino
  688:'#d47a30', // Serbia
  703:'#6ab4cc', // Slovakia
  705:'#4ab065', // Slovenia
  724:'#d4a64a', // Spain
  752:'#5a8ad4', // Sweden
  756:'#d03a7a', // Switzerland
  792:'#9050b0', // Turkey
  804:'#c8956c', // Ukraine
  826:'#c05a5a', // UK
  336:'#a8ccd8', // Vatican
  383:'#d4bc6a', // Kosovo
};

const LARGE = new Set([250,276,724,380,792,826,804,643,616,752,578,246,642,300,348,528,203,112,620,372]);
const MEDIUM = new Set([100,40,703,705,191,428,233,440,208,498,688,807,499,8,196]);

// [name, lon, lat, href]
const PINS = [
  ['Alesund',        6.15, 62.47, '../Guides/Alesund/alesund_v1.html'],
  ['Amsterdam',      4.90, 52.37, '../Guides/Amsterdam/amsterdam_v1.html'],
  ['Barcelona',      2.17, 41.39, '../Guides/Barcelona/barcelona_v1.html'],
  ['Cascais',       -9.55, 38.70, '../Guides/Cascais/cascais_v2.html'],
  ['Dublin',        -6.27, 53.33, '../Guides/Dublin/dublin_v1.html'],
  ['Iceland',      -18.00, 65.00, '../Guides/Iceland/reykjavik_v2.html'],
  ['Lisbon',        -9.14, 38.72, '../Guides/Lisbon/lisbon_v4.html'],
  ['London',        -0.13, 51.51, '../Guides/London/london_v5.html'],
  ['Madrid',        -3.70, 40.42, '../Guides/Madrid/madrid_v1.html'],
  ['Marktoberdorf', 10.62, 47.78, '../Guides/Marktoberdorf/marktoberdorf_v1.html'],
  ['Munich',        11.58, 48.14, '../Guides/Munich/munich_v2.html'],
  ['Oslo',          10.75, 59.91, '../Guides/Oslo/oslo_v1.html'],
  ['Paris',          2.35, 48.85, '../Guides/Paris/paris_v7.html'],
  ['Porto',         -8.61, 41.15, '../Guides/Porto/porto_v2.html'],
  ['Sintra',        -9.39, 38.95, '../Guides/Sintra/sintra_v2.html'],
  ['Tromso',        18.96, 69.65, '../Guides/Tromso/tromso_v1.html'],
  ['Turin',          7.69, 45.07, '../Guides/Turin/turin_v14.html'],
  ['Vienna',        16.37, 48.21, '../Guides/Vienna/vienna_v1.html'],
  ['Zurich',         8.54, 47.37, '../Guides/Zurich/zurich_v1.html'],
];

const proj = d3.geoMercator().center([6,54]).scale(580).translate([380,295]);
const pathGen = d3.geoPath().projection(proj);
const svg = d3.select('#svg');
const tip = document.getElementById('tip');
const tn = document.getElementById('tn'), ts = document.getElementById('ts');
const footer = document.getElementById('footer');
const wrap = document.getElementById('wrap');

function showTip(event, name, sub) {
  tn.textContent = name; ts.textContent = sub || ''; tip.style.opacity = '1';
  const r = wrap.getBoundingClientRect();
  let x = event.clientX - r.left + 14, y = event.clientY - r.top - 44;
  const tw = tip.offsetWidth || 140;
  if (x + tw > r.width - 8) x = event.clientX - r.left - tw - 14;
  if (y < 4) y = event.clientY - r.top + 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r => r.json())
  .then(world => {
    const countries = topojson.feature(world, world.objects.countries);
    const borders   = topojson.mesh(world, world.objects.countries, (a,b) => a !== b);
    const eu = countries.features.filter(f => EU[+f.id]);

    svg.selectAll('.country').data(eu).join('path')
      .attr('class','country').attr('d', pathGen)
      .style('fill', d => COLORS[+d.id] || '#b5a898')
      .on('mousemove', (e,d) => { showTip(e, EU[+d.id], ''); footer.textContent = EU[+d.id]; })
      .on('mouseleave', () => { tip.style.opacity='0'; footer.textContent='Hover a country · Click a pin to open guide'; });

    svg.append('path').datum(borders).attr('class','borders').attr('d', pathGen);

    svg.selectAll('.country-label')
      .data(eu.filter(f => LARGE.has(+f.id) || MEDIUM.has(+f.id)))
      .join('text')
      .attr('class', d => LARGE.has(+d.id) ? 'country-label large' : 'country-label medium')
      .attr('transform', d => { const c = pathGen.centroid(d); return `translate(${c[0]},${c[1]})`; })
      .text(d => SHORT[EU[+d.id]] || EU[+d.id]);

    const pinG = svg.append('g');
    PINS.forEach(([name, lon, lat, href]) => {
      const [px, py] = proj([lon, lat]);
      const g = pinG.append('g').attr('class','pin-group')
        .attr('transform', `translate(${px},${py})`)
        .on('click', () => window.open(href, '_blank'))
        .on('mousemove', e => { showTip(e, name, '📖 Open Guide'); footer.textContent = name + ' — click to open guide'; })
        .on('mouseleave', () => { tip.style.opacity='0'; footer.textContent='Hover a country · Click a pin to open guide'; });
      g.append('circle').attr('class','pin-circle').attr('r', 5);
      g.append('text').attr('class','pin-label').attr('y', -9).text(name);
    });
  })
  .catch(() => {
    svg.append('text').attr('x',450).attr('y',295)
      .attr('text-anchor','middle').attr('fill','#6b4422').attr('font-size',15)
      .text('Could not load map data — please check your internet connection.');
  });
</script>
</body>
</html>
