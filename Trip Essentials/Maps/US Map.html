<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../../_travel_style.css">
<title>US Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple Color Emoji', 'Segoe UI Emoji', Arial, sans-serif; }
  body { display: flex; flex-direction: column; }
  #map-header { background: linear-gradient(135deg, #7a3b1e 0%, #b85c2a 55%, #d4874a 100%); padding: 14px 18px; border-radius: 10px; flex-shrink: 0; margin-bottom: 12px; }
  #map-header h1 { font-size: 16px; font-weight: bold; color: #ffffff; text-transform: uppercase; letter-spacing: 0.04em; }
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; background: #cfe0e4; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .neighbor { fill: #cdbfa3; stroke: #a89a7e; stroke-width: 0.6; pointer-events: none; }
  .neighbor-label { font-size: 12px; font-weight: 700; fill: #9a8c70; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; paint-order: stroke; stroke: rgba(232,223,208,0.7); stroke-width: 3px; }
  .state { stroke: #fdf8f0; stroke-width: 1.2; cursor: default; transition: filter 0.12s; }
  .state:hover { filter: brightness(1.12); }
  .state-borders { fill: none; stroke: none; pointer-events: none; }
  .nation-border { fill: none; stroke: none; pointer-events: none; }
  .state-label { font-size: 12px; font-weight: 700; fill: #9a8b78; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; paint-order: stroke; stroke: rgba(253,248,240,0.8); stroke-width: 2.5px; }
  .state-label.large { font-size: 12px; }
  .pin-group { cursor: pointer; }
  .pin-circle { fill: #b85c2a; stroke: #fdf8f0; stroke-width: 1.8; transition: transform 0.15s, fill 0.15s; transform-origin: center; transform-box: fill-box; }
  .pin-group:hover .pin-circle { fill: #7a3b1e; transform: scale(1.5); }
  .pin-leader { stroke: #b85c2a; stroke-width: 1; opacity: 0.45; pointer-events: none; }
  .pin-label { font-size: 12px; font-weight: 700; fill: #5a3115; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; paint-order: stroke; stroke: rgba(253,248,240,0.95); stroke-width: 3.5px; }
  .pin-group:hover .pin-label { fill: #b85c2a; }
  #tip { position: absolute; pointer-events: none; background: #6b4422; color: #fdf8f0; padding: 7px 15px; border-radius: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; box-shadow: 0 4px 18px rgba(0,0,0,0.28); white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 99; }
  .tip-sub { font-size: 12px; color: #e5c99a; margin-top: 2px; }
  /* ── Greyed-out "Caribbean belongs here" affordance ── */
  .region-ghost { cursor: pointer; opacity: 0.6; transition: opacity .15s; }
  .region-ghost:hover { opacity: 1; }
  .region-ghost .rg-box { fill: rgba(120,108,86,0.16); stroke: #9a8c70; stroke-width: 1.2; stroke-dasharray: 4 3; }
  .region-ghost .rg-text { font-size: 12px; font-weight: 700; fill: #6f6552; letter-spacing: 0.03em; }
#legend { position: absolute; top: 14px; right: 14px; background: rgba(253,248,240,0.90); border-radius: 8px; padding: 7px 12px; font-size: 12px; color: #6b4422; display: flex; align-items: center; gap: 7px; font-weight: 600; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .ldot { width: 10px; height: 10px; border-radius: 50%; background: #b85c2a; border: 2px solid #fdf8f0; box-shadow: 0 0 0 1px #b85c2a; flex-shrink: 0; }
  #region-nav { position:absolute; left:16px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:7px; z-index:10; padding:0; background:none; border:none; overflow:visible; }
  .rn { padding:5px 14px; border-radius:20px; border:1.5px solid #d8d4cc; background:#f5f4f0; color:#6b4422; font-size: 12px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .12s,border-color .12s; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.22); }
  .rn:hover { background:#faefd8; border-color:#8a6c1a; }
  .rn.rn-on { background:linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%); color:#fdf8f0; border-color:#b85c2a; }
  /* ── Compact toolbar on map pages ── */

  #map-left-stack { position:absolute; left:14px; top:35%; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; align-items:flex-start; z-index:10; }
  #left-panel { display:flex; flex-direction:column; background:rgba(247,244,238,0.97); border-radius:12px; padding:10px 8px; box-shadow:0 2px 12px rgba(0,0,0,0.13); backdrop-filter:blur(4px); }
  #guide-legend { background:rgba(247,244,238,0.97); border-radius:8px; padding:6px 12px; font-size: 12px; color:#6b4422; display:flex; align-items:center; gap:7px; font-weight:600; box-shadow:0 1px 6px rgba(0,0,0,0.10); }
  #region-nav { position:static !important; left:auto; top:auto; transform:none; display:flex; flex-direction:column; gap:7px; z-index:auto; }

  /* ── Region-coloured nav pills ── */
  .rn { display:flex; align-items:center; gap:7px; }
  .rn::before { content:''; width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .rn-eu  { background:#fde8e8 !important; border-color:#f0a0a0 !important; color:#a02020 !important; }
  .rn-eu::before  { background:#dc4444; }
  .rn-na  { background:#fdf0e4 !important; border-color:#f0b878 !important; color:#8a3a08 !important; }
  .rn-na::before  { background:#e87830; }
  .rn-cb  { background:#d8efe9 !important; border-color:#7fcabd !important; color:#0c6b5d !important; }
  .rn-cb::before  { background:#14a18d; }
  .rn-as  { background:#fdf5d8 !important; border-color:#e8d060 !important; color:#7a5000 !important; }
  .rn-as::before  { background:#c8940a; }
  .rn-af  { background:#e4f5e8 !important; border-color:#90d0a0 !important; color:#1a6030 !important; }
  .rn-af::before  { background:#2ea84e; }
  .rn-sa  { background:#e4eef8 !important; border-color:#90b8e8 !important; color:#1a3a8b !important; }
  .rn-sa::before  { background:#3a74d4; }
  .rn-oc  { background:#f0e8f8 !important; border-color:#c090e0 !important; color:#4a1880 !important; }
  .rn-oc::before  { background:#8050d0; }
  .rn.rn-on { background:linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%) !important; color:#fdf8f0 !important; border-color:#b85c2a !important; }
  .rn.rn-on::before { background:rgba(255,255,255,0.55); }
@media (max-width: 640px) {
  #map-left-stack { left: 8px; gap: 8px; }
  #left-panel { padding: 7px 6px; gap: 3px; }
  .zn, .rn { padding: 3px 9px; font-size: 11px; }
  .zoom-section-label { font-size: 10px; }
  #guide-legend { font-size: 11px; padding: 5px 8px; }
}
</style>

<div id="wrap">
  <svg id="svg"></svg>
<div id="map-left-stack">
<div id="guide-legend"><div class="ldot"></div> Guide available</div>

  <div id="tip"><div id="tn"></div><div class="tip-sub" id="ts"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
// FIPS → state name
const STATES = {
  1:'Alabama',2:'Alaska',4:'Arizona',5:'Arkansas',6:'California',
  8:'Colorado',9:'Connecticut',10:'Delaware',11:'D.C.',12:'Florida',
  13:'Georgia',15:'Hawaii',16:'Idaho',17:'Illinois',18:'Indiana',
  19:'Iowa',20:'Kansas',21:'Kentucky',22:'Louisiana',23:'Maine',
  24:'Maryland',25:'Massachusetts',26:'Michigan',27:'Minnesota',
  28:'Mississippi',29:'Missouri',30:'Montana',31:'Nebraska',32:'Nevada',
  33:'New Hampshire',34:'New Jersey',35:'New Mexico',36:'New York',
  37:'North Carolina',38:'North Dakota',39:'Ohio',40:'Oklahoma',
  41:'Oregon',42:'Pennsylvania',44:'Rhode Island',45:'South Carolina',
  46:'South Dakota',47:'Tennessee',48:'Texas',49:'Utah',50:'Vermont',
  51:'Virginia',53:'Washington',54:'West Virginia',55:'Wisconsin',56:'Wyoming'
};

// Short labels for small states
const SHORT = {
  'Connecticut':'CT','Delaware':'DE','D.C.':'DC','Hawaii':'HI',
  'Massachusetts':'MA','Maryland':'MD','New Hampshire':'NH',
  'New Jersey':'NJ','Rhode Island':'RI','Vermont':'VT'
};

// Warm palette — map-friendly colors matching guide aesthetic
const COLORS = {
  1:'#cda36e',2:'#c98f63',4:'#d8be8f',5:'#bd8a5e',6:'#c7a877',
  8:'#b89066',9:'#d2b07e',10:'#c0905f',11:'#cbb083',12:'#b58a5c',
  13:'#d0a96f',15:'#c19064',16:'#cda36e',17:'#c98f63',18:'#d8be8f',
  19:'#bd8a5e',20:'#c7a877',21:'#b89066',22:'#d2b07e',23:'#c0905f',
  24:'#cbb083',25:'#b58a5c',26:'#d0a96f',27:'#c19064',28:'#cda36e',
  29:'#c98f63',30:'#d8be8f',31:'#bd8a5e',32:'#c7a877',33:'#b89066',
  34:'#d2b07e',35:'#c0905f',36:'#cbb083',37:'#b58a5c',38:'#d0a96f',
  39:'#c19064',40:'#cda36e',41:'#c98f63',42:'#d8be8f',44:'#bd8a5e',
  45:'#c7a877',46:'#b89066',47:'#d2b07e',48:'#c0905f',49:'#cbb083',
  50:'#b58a5c',51:'#d0a96f',53:'#c19064',54:'#cda36e',55:'#c98f63',
  56:'#d8be8f'
};
function darken(hex,f){var n=parseInt(hex.slice(1),16);var r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

// Large enough states to show full label
const LARGE_STATES = new Set([6,8,4,48,30,32,35,41,53,16,27,31,38,46,56,20,19,25,22,13,12,47]);

// Guide pins [name, lon, lat, href]
const PINS = [
  ['Alaska',       -153.00, 64.20, '../../Guides/Alaska/alaska_v1.html'],
  ['Atlanta',      -84.39, 33.77, '../../Guides/Atlanta/atlanta_v1.html'],
  ['Austin',       -97.74, 30.27, '../../Guides/Austin/austin_v1.html'],
  ['Bend',         -121.31, 44.06, '../../Guides/Bend/bend_v2.html'],
  ['Big Island',   -155.50, 19.60, '../../Guides/Big Island/big_island_v1.html'],
  ['Maui',         -156.33, 20.80, '../../Guides/Maui/maui_v1.html'],
  ['Kauai',        -159.50, 22.05, '../../Guides/Kauai/kauai_v1.html'],
  ['Oahu',         -157.85, 21.30, '../../Guides/Oahu/oahu_v1.html'],
  ['Boston',        -71.06, 42.36, '../../Guides/Boston/boston_v1.html'],
  ['Chicago',       -87.63, 41.88, '../../Guides/Chicago/chicago_v1.html'],
  ['Los Angeles',  -118.24, 34.05, '../../Guides/Los Angeles/los_angeles_v1.html'],
  ['Miami',         -80.19, 25.77, '../../Guides/Miami/miami_v1.html'],
  ['New York',      -74.00, 40.71, '../../Guides/New York/new_york_v1.html'],
  ['Orlando',       -81.38, 28.54, '../../Guides/Orlando/orlando_v1.html'],
  ['Palm Desert',  -116.37, 33.72, '../../Guides/Palm Desert/palm_desert_v1.html'],
  ['Palo Alto',    -122.14, 37.44, '../../Guides/Palo Alto/palo_alto_v6.html'],
  ['Pasadena',     -118.14, 34.15, '../../Guides/Pasadena/pasadena_v5.html'],
  ['San Diego',    -117.16, 32.72, '../../Guides/San Diego/san_diego_v1.html'],
  ['San Francisco',-122.42, 37.77, '../../Guides/San Francisco/sf_v3.html'],
  ['Scottsdale',   -111.93, 33.49, '../../Guides/Scottsdale/scottsdale_v1.html'],
  ['Seattle',      -122.33, 47.61, '../../Guides/Seattle/seattle_v1.html'],
  ['Montreal',   -73.57, 45.50, '../../Guides/Montreal/montreal_v1.html'],
  ['Quebec City',-71.21, 46.81, '../../Guides/Quebec City/quebec_city_v1.html'],
  ['Toronto',    -79.38, 43.65, '../../Guides/Toronto/toronto_v1.html'],
  ['Vancouver',  -123.12, 49.28, '../../Guides/Vancouver/vancouver_v1.html'],
];

const tip = document.getElementById('tip');
const tn = document.getElementById('tn'), ts = document.getElementById('ts');
const wrap = document.getElementById('wrap');
let usData = null, worldData = null;

function showTip(event, name, sub) {
  tn.textContent = name; ts.textContent = sub || ''; tip.style.opacity = '1';
  const r = wrap.getBoundingClientRect();
  let x = event.clientX - r.left + 14, y = event.clientY - r.top - 44;
  const tw = tip.offsetWidth || 140;
  if (x + tw > r.width - 8) x = event.clientX - r.left - tw - 14;
  if (y < 4) y = event.clientY - r.top + 14;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}

function buildMap() {
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const svgEl = document.getElementById('svg');
  svgEl.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  if (!usData || !worldData) return;

  const proj = d3.geoAlbersUsa().scale(Math.min(W * 1.1, H * 1.9)).translate([W * 0.5, H * 0.5]);
  const pathGen = d3.geoPath().projection(proj);

  const states   = topojson.feature(usData, usData.objects.states);
  const borders  = topojson.mesh(usData, usData.objects.states, (a, b) => a !== b);
  const nation   = topojson.mesh(usData, usData.objects.states, (a, b) => a === b);

  const svg = d3.select('#svg');
  svg.selectAll('*').remove();

  // Muted neighbor backdrop (Canada, Mexico) so border-region pins sit on land
  const _neigh = topojson.feature(worldData, worldData.objects.countries).features
    .filter(f => +f.id === 124 || +f.id === 484);
  svg.selectAll('.neighbor').data(_neigh).join('path').attr('class', 'neighbor').attr('d', pathGen);

  // States
  svg.selectAll('.state').data(states.features).join('path')
    .attr('class', 'state').attr('d', pathGen)
    .style('fill',d=>COLORS[+d.id]||'#c2a878').style('stroke',d=>darken(COLORS[+d.id]||'#c2a878',0.6)).style('stroke-width',0.8)
    .on('mousemove', (e, d) => {
      const name = STATES[+d.id] || 'Unknown';
      showTip(e, name, '');
    })
    .on('mouseleave', () => { tip.style.opacity = '0'; });

  // State borders
  svg.append('path').datum(borders).attr('class', 'state-borders').attr('d', pathGen);
  svg.append('path').datum(nation).attr('class', 'nation-border').attr('d', pathGen);

  // ── Collision-aware labels: pins get priority, state names dropped on collision ──
  const placed = [];
  const _ov = (a, b) => !(a.x2 < b.x1 || b.x2 < a.x1 || a.y2 < b.y1 || b.y2 < a.y1);
  const _fits = r => !placed.some(p => _ov(p, r));
  function _reserve(cx, cy, w, h) { placed.push({ x1: cx-w/2, y1: cy-h/2, x2: cx+w/2, y2: cy+h/2 }); }
  function _best(cx, cy, w, h, cands) {
    for (const [dx, dy] of cands) {
      const r = { x1: cx+dx-w/2, y1: cy+dy-h/2, x2: cx+dx+w/2, y2: cy+dy+h/2 };
      if (_fits(r)) { placed.push(r); return [dx, dy]; }
    }
    return null;
  }

  const _vis = [];
  PINS.forEach(function(p) {
    const pt = proj([p[1], p[2]]);
    if (!pt) return; // AlbersUSA returns null for out-of-range coords
    _vis.push({ name: p[0], href: p[3], px: pt[0], py: pt[1] });
  });
  _vis.forEach(v => _reserve(v.px, v.py, 13, 13));

  const pinG = svg.append('g');
  const _FS = 11.5;
  _vis.forEach(function(v) {
    const g = pinG.append('g').attr('class', 'pin-group')
      .attr('transform', 'translate(' + v.px + ',' + v.py + ')')
      .on('click', () => window.open(v.href, '_blank'))
      .on('mousemove', e => { showTip(e, v.name, '📖 Open Guide'); })
      .on('mouseleave', () => { tip.style.opacity = '0'; });
    const w = v.name.length * _FS * 0.62 + 4, h = _FS + 4;
    const up = -(h/2 + 8), dn = (h/2 + 8), rt = (w/2 + 11), lf = -(w/2 + 11);
    const cands = [[0,up],[0,dn],[rt,0],[lf,0],[rt,up],[lf,up],[rt,dn],[lf,dn],[0,up-h],[0,dn+h],[0,up-2*h],[0,dn+2*h]];
    const s = _best(v.px, v.py, w, h, cands) || [0, up];
    const dist = Math.sqrt(s[0]*s[0] + s[1]*s[1]);
    if (dist > 15) {
      const ux = s[0]/dist, uy = s[1]/dist;
      g.append('line').attr('class', 'pin-leader')
        .attr('x1', ux*5.5).attr('y1', uy*5.5).attr('x2', s[0]-ux*6).attr('y2', s[1]-uy*6);
    }
    g.append('circle').attr('class', 'pin-circle').attr('r', 6);
    g.append('text').attr('class', 'pin-label').attr('x', s[0]).attr('y', s[1]).text(v.name);
  });

  const _sl = svg.append('g');
  states.features.forEach(function(d) {
    const c = pathGen.centroid(d);
    if (!c || isNaN(c[0])) return;
    const nm = STATES[+d.id] || '', txt = SHORT[nm] || nm;
    if (!txt) return;
    const w = txt.length * 12 * 0.6 + 2, h = 14;
    const s = _best(c[0], c[1], w, h, [[0,0],[0,-13],[0,13],[16,0],[-16,0]]);
    if (!s) return;
    _sl.append('text').attr('class', LARGE_STATES.has(+d.id) ? 'state-label large' : 'state-label')
      .attr('transform', 'translate(' + (c[0]+s[0]) + ',' + (c[1]+s[1]) + ')').text(txt);
  });

  // Neighbor names — lowest priority, dropped on any collision
  const _nl = svg.append('g');
  _neigh.forEach(function(d) {
    const c = pathGen.centroid(d);
    if (!c || isNaN(c[0])) return;
    const txt = (+d.id === 124) ? 'Canada' : 'Mexico';
    const w = txt.length * 12 * 0.6 + 2, h = 14;
    const s = _best(c[0], c[1], w, h, [[0,0],[0,-13],[0,13]]);
    if (!s) return;
    _nl.append('text').attr('class', 'neighbor-label')
      .attr('transform', 'translate(' + (c[0]+s[0]) + ',' + (c[1]+s[1]) + ')').text(txt);
  });

  // Caribbean sits SE of Florida — off this projection. Greyed pointer to its own map.
  addCaribGhost(svg, W - 144, H - 58, '›');
}

function addCaribGhost(svg, x, y, arrow) {
  const w = 128, h = 27;
  const g = svg.append('g').attr('class', 'region-ghost')
    .on('click', () => { window.location.href = 'Caribbean%20Map.html'; })
    .on('mousemove', e => showTip(e, 'Caribbean', '📍 Open Caribbean map'))
    .on('mouseleave', () => { tip.style.opacity = '0'; });
  g.append('rect').attr('class', 'rg-box').attr('x', x).attr('y', y).attr('width', w).attr('height', h).attr('rx', 13);
  g.append('text').attr('class', 'rg-text').attr('x', x + w/2).attr('y', y + h/2)
    .attr('text-anchor', 'middle').attr('dominant-baseline', 'central').text('🏝 Caribbean ' + arrow);
}

Promise.all([
  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(r => r.json()),
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r => r.json())
])
  .then(([us, world]) => { usData = us; worldData = world; buildMap(); })
  .catch(() => {
    d3.select('#svg').append('text').attr('x', '50%').attr('y', '50%')
      .attr('text-anchor', 'middle').attr('fill', '#6b4422').attr('font-size', 16)
      .text('Could not load map data — please check your internet connection.');
  });

let resizeTimer;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(buildMap, 80); });
</script>
