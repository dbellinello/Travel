<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South America Map</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #f5f4f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { display: flex; flex-direction: column; }
  #map-header { padding: 16px 24px 10px; flex-shrink: 0; }
  #map-header h1 { font-size: 20px; font-weight: 700; color: #6b4422; letter-spacing: -0.01em; }
  #wrap { position: relative; flex: 1 1 auto; min-height: 0; background: #e8dfd0; overflow: hidden; }
  svg { width: 100%; height: 100%; display: block; }
  .country { stroke: #fdf8f0; stroke-width: 1.4; cursor: default; transition: filter 0.12s; }
  .country:hover { filter: brightness(1.12); }
  .borders { fill: none; stroke: rgba(253,248,240,0.7); stroke-width: 0.7; pointer-events: none; }
  .country-label { font-size: 9px; font-weight: 700; fill: #3a1a00; text-anchor: middle; dominant-baseline: central; pointer-events: none; user-select: none; paint-order: stroke; stroke: rgba(253,248,240,0.8); stroke-width: 3px; }
  .country-label.large { font-size: 12px; }
  .country-label.medium { font-size: 10px; }
  .pin-group { cursor: pointer; }
  .pin-circle { fill: #6b4422; stroke: #fdf8f0; stroke-width: 2; transition: transform 0.15s, fill 0.15s; transform-origin: center; transform-box: fill-box; }
  .pin-group:hover .pin-circle { fill: #BA7517; transform: scale(1.5); }
  .pin-label { font-size: 9px; font-weight: 700; fill: #6b4422; text-anchor: middle; dominant-baseline: auto; pointer-events: none; user-select: none; paint-order: stroke; stroke: rgba(253,248,240,0.95); stroke-width: 3.5px; }
  .pin-group:hover .pin-label { fill: #BA7517; }
  #tip { position: absolute; pointer-events: none; background: #6b4422; color: #fdf8f0; padding: 7px 15px; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: 0.02em; box-shadow: 0 4px 18px rgba(0,0,0,0.28); white-space: nowrap; opacity: 0; transition: opacity 0.1s; z-index: 99; }
  .tip-sub { font-size: 11px; color: #e5c99a; margin-top: 2px; }
#legend { position: absolute; top: 14px; right: 14px; background: rgba(253,248,240,0.90); border-radius: 8px; padding: 7px 12px; font-size: 11px; color: #6b4422; display: flex; align-items: center; gap: 7px; font-weight: 600; box-shadow: 0 1px 6px rgba(0,0,0,0.08); }
  .ldot { width: 10px; height: 10px; border-radius: 50%; background: #6b4422; border: 2px solid #fdf8f0; box-shadow: 0 0 0 1px #6b4422; flex-shrink: 0; }
  #region-nav { position:absolute; left:16px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:7px; z-index:10; padding:0; background:none; border:none; overflow:visible; }
  .rn { padding:5px 14px; border-radius:20px; border:1.5px solid #d8d4cc; background:#f5f4f0; color:#6b4422; font-size:12px; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .12s,border-color .12s; flex-shrink:0; box-shadow:0 2px 8px rgba(0,0,0,0.22); }
  .rn:hover { background:#faefd8; border-color:#8a6c1a; }
  .rn.rn-on { background:linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%); color:#fdf8f0; border-color:#b85c2a; }
  /* ── Compact toolbar on map pages ── */

  #map-left-stack { position:absolute; left:14px; top:35%; transform:translateY(-50%); display:flex; flex-direction:column; gap:12px; align-items:flex-start; z-index:10; }
  #left-panel { display:flex; flex-direction:column; background:rgba(253,248,240,0.82); border-radius:12px; padding:10px 8px; box-shadow:0 2px 12px rgba(0,0,0,0.13); backdrop-filter:blur(4px); }
  #guide-legend { background:rgba(253,248,240,0.92); border-radius:8px; padding:6px 12px; font-size:11px; color:#6b4422; display:flex; align-items:center; gap:7px; font-weight:600; box-shadow:0 1px 6px rgba(0,0,0,0.10); }
  #region-nav { position:static !important; left:auto; top:auto; transform:none; display:flex; flex-direction:column; gap:7px; z-index:auto; }

  /* ── Region-coloured nav pills ── */
  .rn { display:flex; align-items:center; gap:7px; }
  .rn::before { content:''; width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .rn-eu  { background:#fde8e8 !important; border-color:#f0a0a0 !important; color:#a02020 !important; }
  .rn-eu::before  { background:#dc4444; }
  .rn-na  { background:#fdf0e4 !important; border-color:#f0b878 !important; color:#8a3a08 !important; }
  .rn-na::before  { background:#e87830; }
  .rn-as  { background:#fdf5d8 !important; border-color:#e8d060 !important; color:#7a5000 !important; }
  .rn-as::before  { background:#c8940a; }
  .rn-af  { background:#e4f5e8 !important; border-color:#90d0a0 !important; color:#1a6030 !important; }
  .rn-af::before  { background:#2ea84e; }
  .rn-sa  { background:#e4eef8 !important; border-color:#90b8e8 !important; color:#1a3a8b !important; }
  .rn-sa::before  { background:#3a74d4; }
  .rn-oc  { background:#f0e8f8 !important; border-color:#c090e0 !important; color:#4a1880 !important; }
  .rn-oc::before  { background:#8050d0; }
  .rn.rn-on { background:linear-gradient(135deg,#7a3b1e 0%,#b85c2a 55%,#d4874a 100%) !important; color:#fdf8f0 !important; border-color:#b85c2a !important; }
  .rn.rn-on::before { background:rgba(255,255,255,0.55); }
</style>
</head>
<body>
<div id="toolbar-mount" data-depth="2" data-maxwidth="1400" data-no-footnote="1"></div>
<script src="../../toolbar.js?v=2"></script>

<div id="wrap">
  <svg id="svg"></svg>
<div id="map-left-stack">
<div id="guide-legend"><div class="ldot"></div> Guide available</div>
<div id="left-panel">
<div id="region-nav">
  <a class="rn rn-eu" href="Europe%20Map.html">Europe</a>
  <a class="rn rn-na" href="US%20Map.html">N. America</a>
  <a class="rn rn-as" href="Asia%20Map.html">Asia</a>
  <a class="rn rn-af" href="Africa%20Map.html">Africa</a>
  <a class="rn rn-sa rn-on" href="South%20America%20Map.html">S. America</a>
  <a class="rn rn-oc" href="Oceania%20Map.html">Oceania</a>
</div>
</div>
</div>
  <div id="tip"><div id="tn"></div><div class="tip-sub" id="ts"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const COUNTRIES = {"32": "Argentina", "68": "Bolivia", "76": "Brazil", "152": "Chile", "170": "Colombia", "218": "Ecuador", "328": "Guyana", "600": "Paraguay", "604": "Peru", "740": "Suriname", "858": "Uruguay", "862": "Venezuela"};
const SHORT = {};
const COLORS = {"32": "#c8956c", "68": "#7aab8a", "76": "#6a8fd4", "152": "#d47a30", "170": "#9dbfbf", "218": "#d4bc6a", "328": "#c46a8a", "600": "#5abfa0", "604": "#9050b0", "740": "#d03a7a", "858": "#4ab065", "862": "#6ab4cc"};
const LARGE = new Set([32,76,152,170,604]);
const MEDIUM = new Set([68,218,328,600,740,858,862]);
const PINS = [];
const BOUNDS = [[-82, -56], [-33, 13]];

const tip=document.getElementById('tip'),tn=document.getElementById('tn'),ts=document.getElementById('ts');
const wrap=document.getElementById('wrap');
let worldData=null;

function showTip(e,name,sub){
  tn.textContent=name;ts.textContent=sub||'';tip.style.opacity='1';
  const r=wrap.getBoundingClientRect();
  let x=e.clientX-r.left+14,y=e.clientY-r.top-44;
  const tw=tip.offsetWidth||140;
  if(x+tw>r.width-8)x=e.clientX-r.left-tw-14;
  if(y<4)y=e.clientY-r.top+14;
  tip.style.left=x+'px';tip.style.top=y+'px';
}

function buildMap(){
  const W=wrap.clientWidth,H=wrap.clientHeight;
  if(!W||!H||!worldData)return;
  document.getElementById('svg').setAttribute('viewBox','0 0 '+W+' '+H);
  const countries=topojson.feature(worldData,worldData.objects.countries);
  const borders=topojson.mesh(worldData,worldData.objects.countries,(a,b)=>a!==b);
  const feats=countries.features.filter(f=>COUNTRIES[+f.id]);
  const proj=d3.geoMercator().fitExtent([[10,8],[W-10,H-8]],
    {type:'Feature',geometry:{type:'LineString',coordinates:[BOUNDS[0],BOUNDS[1]]}});
  const pathGen=d3.geoPath().projection(proj);
  const svg=d3.select('#svg');
  svg.selectAll('*').remove();
  svg.selectAll('.country').data(feats).join('path').attr('class','country').attr('d',pathGen)
    .style('fill',d=>COLORS[+d.id]||'#b5a898')
    .on('mousemove',(e,d)=>{showTip(e,COUNTRIES[+d.id],'');})
    .on('mouseleave',()=>{tip.style.opacity='0';});
  svg.append('path').datum(borders).attr('class','borders').attr('d',pathGen);
  svg.selectAll('.country-label').data(feats.filter(f=>LARGE.has(+f.id)||MEDIUM.has(+f.id))).join('text')
    .attr('class',d=>LARGE.has(+d.id)?'country-label large':'country-label medium')
    .attr('transform',d=>{const c=pathGen.centroid(d);if(!c||isNaN(c[0]))return'translate(-9999,-9999)';return'translate('+c[0]+','+c[1]+')';})
    .text(d=>SHORT[COUNTRIES[+d.id]]||COUNTRIES[+d.id]);
  const pinG=svg.append('g');
  PINS.forEach(([name,lon,lat,href])=>{
    const pt=proj([lon,lat]);if(!pt||isNaN(pt[0]))return;
    const g=pinG.append('g').attr('class','pin-group').attr('transform','translate('+pt[0]+','+pt[1]+')')
      .on('click',()=>window.open(href,'_blank'))
      .on('mousemove',e=>{showTip(e,name,'📖 Open Guide');})
      .on('mouseleave',()=>{tip.style.opacity='0';});
    g.append('circle').attr('class','pin-circle').attr('r',6);
    g.append('text').attr('class','pin-label').attr('y',-10).text(name);
  });
}

fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
  .then(r=>r.json()).then(w=>{worldData=w;buildMap();});
let t;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(buildMap,80);});
</script>
</body>
</html>
